name: btc-alert-bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: btc-alert-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurer l'état du bot
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Lancer le bot (5 h 45)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: timeout 345m python btc_alert_bot.py --config config.toml --data-dir data || true

      - name: Sauvegarder l'état du bot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bot-state-${{ github.run_id }}
