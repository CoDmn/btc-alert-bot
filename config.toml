# ─────────────────────────────────────────────────────────────────────────────
#  Niveaux du 5 octobre 2026, 05:13 (heatmap Coinglass, Binance BTC/USDT perp, 24 h + 3 jours)
#  Prix de référence : 86 428. Plus haut de la nuit ≈ 86 950.
#  Liquidité au-dessus : 87 150–87 700 (gros bloc), puis 88 300–88 500.
#  Liquidité en dessous : 85 450–85 950 (longs ouverts sur la cassure, pic ≈ 85 720),
#                         84 850–85 000, 84 000–84 600, puis le gros bloc 83 450–83 650.
#  Ils se périment vite : après valid_until, le bot n'émet plus de signaux.
#  Le bot recharge ce fichier tout seul quand tu le modifies (≤ 30 s).
#  Un scénario dont tu changes un paramètre est réarmé automatiquement.
# ─────────────────────────────────────────────────────────────────────────────

valid_until = "2026-10-06T06:00:00+02:00"
timezone = "Europe/Paris"
poll_seconds = 30          # fréquence de lecture des prix
replay_hours = 6           # au tout premier démarrage, relit les 6 dernières heures (silencieux)
max_alert_age_min = 20     # un déclenchement plus vieux que ça (bot coupé) = « trop tard »

[data]
# Ordre de priorité, bascule automatique si une source ne répond pas.
sources = ["mexc", "binance", "bybit", "coinbase"]
symbol_mexc = "BTC_USDT"
symbol_binance = "BTCUSDT"
symbol_bybit = "BTCUSDT"
symbol_coinbase = "BTC-USD"

[account]
capital_usd = 1890              # 2 000 − la perte du short d'hier
margin_usage = 0.95
mmr = 0.004
taker_fee = 0.0005
max_leverage = 50
min_liq_ratio = 2.5
qty_step = 0.001
move_sl_to_be_after_tp1 = true
min_final_r = 1.5
virtual_trade_max_hours = 72

[touch_alerts]
enabled = true
levels = [87150, 85700, 85000]
rearm_pct = 0.3

# ─────────────────────────────────────────────────────────────────────────────
#  A : chasse aux shorts dans 87 150–87 700 qui échoue → short
#  B : acceptation au-dessus du bloc (clôture 1h > 87 800) + retest → long
#  C : purge des longs de la cassure (85 700) puis reprise de 86 000 → long
#  D : grosse purge jusqu'au bloc 83 450–83 650 puis reprise de 84 000 → long
#  A et B s'excluent : une clôture 1h > 87 800 annule A et arme B.
# ─────────────────────────────────────────────────────────────────────────────

[scenarios.A]
enabled = true
type = "sweep_reversal"
name = "Balayage 87 150–87 700 échoué"
direction = "short"
sweep_level = 87350             # mèche ≥ 87 350 (dans le bloc) → armé
trigger_tf = "15m"
trigger_close = 87150           # puis clôture 15m < 87 150 → short
cancel_tf = "1h"
cancel_close = 87800            # clôture 1h > 87 800 = acceptation au-dessus → annulé
entry_zone = [86950, 87200]
entry_limit = 87100
sl = 87850
sl_buffer = 150                 # SL = le plus haut entre 87 850 et (mèche + 150)
tps = [[86500, 50], [85750, 50]]
risk_usd = 425
expire_hours = 2                # le retour doit être rapide, sinon pas de trade

[scenarios.B]
enabled = true
type = "breakout_retest"
name = "Acceptation au-dessus de 87 800 + retest"
direction = "long"
breakout_tf = "1h"
breakout_close = 87800          # clôture 1h > 87 800 → armé
retest_touch = 87750            # retour toucher ≤ 87 750 (retest peu profond)…
retest_hold_close = 87700       # …et clôture 15m ≥ 87 700 → long
fail_close = 87500              # clôture 15m < 87 500 = cassure ratée → annulé
entry_zone = [87650, 87900]
entry_limit = 87750
sl = 87250
tps = [[88300, 50], [89000, 50]]
risk_usd = 425
expire_hours = 8

[scenarios.C]
enabled = true
type = "sweep_reversal"
name = "Purge 85 700 reprise"
direction = "long"
sweep_level = 85750             # mèche ≤ 85 750 (longs de la cassure liquidés) → armé
trigger_tf = "1h"
trigger_close = 86000           # puis clôture 1h > 86 000 → long
cancel_tf = "1h"
cancel_close = 85300            # clôture 1h < 85 300 = la cassure d'hier est ratée → annulé
entry_zone = [85950, 86250]
entry_limit = 86050
sl = 85350
sl_buffer = 150                 # SL = le plus bas entre 85 350 et (mèche − 150)
tps = [[86900, 40], [87400, 60]]
risk_usd = 425
expire_hours = 10

[scenarios.D]
enabled = true
type = "sweep_reversal"
name = "Purge 83 650 reprise"
direction = "long"
sweep_level = 83650             # mèche ≤ 83 650 (dans le gros bloc jaune) → armé
trigger_tf = "1h"
trigger_close = 84000           # puis clôture 1h > 84 000 → long
cancel_tf = "4h"
cancel_close = 83200            # clôture 4h < 83 200 = thèse morte → annulé
entry_zone = [83950, 84350]
entry_limit = 84050
sl = 83150
sl_buffer = 150
tps = [[85000, 40], [85700, 35], [86900, 25]]
risk_usd = 560
expire_hours = 24
